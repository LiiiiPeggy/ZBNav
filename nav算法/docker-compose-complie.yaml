name: work_compile

x-env-files: &env-files
  - ${ENV_DIR}/ros2.env
  - ${ENV_DIR}/timezone.env
  - ${ENV_DIR}/ywz/runtime.env

services:

  compile:
    image: nav_gui_snapshot:20260813
    container_name: nav_compile

    network_mode: host
    ipc: host

    # ################################
    # Docker: use all CPU cores for compilation
    # ################################
    cpuset: "0-7"

    privileged: true

    ulimits:
      core: 0

    env_file: *env-files

    volumes:
      - /dev:/dev:rw

      - ${ENV_DIR}/ros2/:/root/env/ros2:ro

      # ################################
      # Docker: share LQP workspace with Odin1 and navigation
      # ################################
      - /home/siasun/panda3_2026_07_17/panda3/src/lqp:/root/work/lqp:rw

    working_dir: /root/work/lqp

    stdin_open: true
    tty: true

    restart: "no"

    command:
      - bash
      - -lc
      - |
        set -e

        source /opt/ros/humble/setup.bash

        echo "======================================"
        echo " Compile container started"
        echo " CPU affinity: 0-7"
        echo " Workspace: /root/work/lqp"
        echo "======================================"

        taskset -cp $$$$ || true
        nproc

        exec bash
